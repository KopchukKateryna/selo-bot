name: scrape-selo

# Запуск за розкладом кожні 5 хв: ~4 хв перевіряє графік ЩОХВИЛИНИ (одразу шле в Worker),
# оголошення ДТЕК — раз за запуск у фоні. Сам себе не перезапускає (без безперервного ланцюжка).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scrape-selo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: playwright install --with-deps chromium

      - run: sudo apt-get install -y xvfb

      - name: Scrape DTEK every minute for ~4 min
        run: |
          end=$(( $(date +%s) + 4*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            echo "=== $(TZ=Europe/Kyiv date '+%d.%m %H:%M:%S') ==="
            # оголошення ДТЕК — раз на 5 хв, у фоні (браузер інколи зависає — графік його не чекає)
            if [ $(( i % 5 )) -eq 0 ] && ! pgrep -f "scrape.py notice" >/dev/null; then
              ( timeout 150 xvfb-run -a python -u scraper/scrape.py notice 2>&1 | sed 's/^/[оголошення] /' ) &
            fi
            timeout 100 xvfb-run -a python -u scraper/scrape.py || echo "перевірка не вдалася — спробую за хвилину"
            i=$(( i + 1 ))
            left=$(( 60 - ($(date +%s) - start) ))
            [ "$left" -gt 0 ] && sleep "$left" || true
          done
          wait || true
        env:
          WORKER_URL: "https://selo-bot.kopchuk-maksym.workers.dev,https://svitlo.selo-nalyvaykivka.workers.dev"
          DTEK_SITE: krem
          CITY: с. Наливайківка
          STREET: вул. Центральна
          HOUSE: "1"
          EXTRA_GROUPS: "5.1,5.2,1.1"

