name: scrape-selo

# GitHub запускає розклад для нових репозиторіїв із запізненням і нерегулярно.
# Тому один запуск працює ~5 год 50 хв і сам бере графік ЩОХВИЛИНИ (одразу шле в Worker),
# оголошення ДТЕК читає окремо у фоні раз на 5 хв, а наприкінці запускає себе знову.
# Розклад лишається як запасний (якщо ланцюжок обірветься).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: scrape-selo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: playwright install --with-deps chromium

      - run: sudo apt-get install -y xvfb

      - name: Scrape DTEK every minute for ~5h50m
        run: |
          end=$(( $(date +%s) + 350*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            echo "=== $(TZ=Europe/Kyiv date '+%d.%m %H:%M:%S') ==="
            # оголошення ДТЕК — раз на 5 хв, у фоні (браузер інколи зависає — графік його не чекає)
            if [ $(( i % 5 )) -eq 0 ] && ! pgrep -f "scrape.py notice" >/dev/null; then
              ( timeout 150 xvfb-run -a python -u scraper/scrape.py notice 2>&1 | sed 's/^/[оголошення] /' ) &
            fi
            timeout 100 xvfb-run -a python -u scraper/scrape.py || echo "перевірка не вдалася — спробую за хвилину"
            i=$(( i + 1 ))
            left=$(( 60 - ($(date +%s) - start) ))
            [ "$left" -gt 0 ] && sleep "$left" || true
          done
          wait || true
        env:
          WORKER_URL: "https://selo-bot.kopchuk-maksym.workers.dev,https://svitlo.selo-nalyvaykivka.workers.dev"
          DTEK_SITE: krem
          CITY: с. Наливайківка
          STREET: вул. Центральна
          HOUSE: "1"
          EXTRA_GROUPS: "5.1,5.2,1.1"

      - name: Start the next run
        if: always() && github.event_name != 'schedule'
        run: gh workflow run scrape.yml --ref master -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
