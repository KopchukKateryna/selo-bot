name: scrape-selo

# GitHub запускає розклад для нових репозиторіїв із запізненням і нерегулярно.
# Тому один запуск працює ~5 год 50 хв і сам бере графік кожні 10 хв,
# а наприкінці запускає себе знову. Розклад лишається як запасний (якщо ланцюжок обірветься).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: scrape-selo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: playwright install --with-deps chromium

      - run: sudo apt-get install -y xvfb

      - name: Scrape DTEK every 10 min for ~5h50m
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            echo "=== $(TZ=Europe/Kyiv date '+%d.%m %H:%M') ==="
            timeout 480 xvfb-run -a python scraper/scrape.py || echo "запуск не вдався — спробую через 10 хв"
            left=$(( 600 - ($(date +%s) - start) ))
            [ "$left" -gt 0 ] && [ $(( $(date +%s) + left )) -lt "$end" ] && sleep "$left" || true
          done
        env:
          WORKER_URL: https://selo-bot.kopchuk-maksym.workers.dev
          DTEK_SITE: krem
          CITY: с. Наливайківка
          STREET: вул. Центральна
          HOUSE: "1"

      - name: Start the next run
        if: always() && github.event_name != 'schedule'
        run: gh workflow run scrape.yml --ref master -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
