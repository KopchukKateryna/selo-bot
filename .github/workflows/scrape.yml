name: scrape-selo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scrape-selo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: playwright install --with-deps chromium

      - run: sudo apt-get install -y xvfb

      - name: Scrape DTEK and send to the village Worker
        run: xvfb-run -a python scraper/scrape.py
        env:
          WORKER_URL: https://selo-bot.kopchuk-maksym.workers.dev
          DTEK_SITE: krem
          CITY: с. Наливайківка
          STREET: вул. Центральна
          HOUSE: "1"
